description: >
    Implement to indicate the operational status of the object
properties:
    - name: Degraded
      type: boolean
      default: false
      flags:
          - readonly
      description: >
          The object is degraded or not. A "Degraded" of true is mapped to a
          Redfish "Status""State" of "Degraded".
    - name: Functional
      type: boolean
      description: >
          The object is functional or not. A "Functional" of false is mapped to
          a Redfish "Status""Health" of "Critical".
      default: false
