description: >
    Provides access to the objects, interfaces, and properties in a subtree of
    objects. The root of the subtree implements this interface.

    Property values use the aggregate variant of all non-recursive property
    types defined in this repository. Enumerations are represented as strings.

    See
    https://dbus.freedesktop.org/doc/dbus-specification.html#standard-interfaces-objectmanager.

methods:
    - name: GetManagedObjects
      description: >
          Returns all managed objects with their interfaces and properties.
          Returned object paths must be descendants of the object implementing
          this interface; the ObjectManager object itself is not included.
      returns:
          - name: Objects
            type: dict[object_path,dict[string,dict[string,variant[all]]]]
            description: >
                Maps object paths to interface names, then to property names and
                values. Each property dictionary is the same as the result of
                org.freedesktop.DBus.Properties.GetAll for that object and
                interface. Interfaces without properties have an empty property
                dictionary.

signals:
    - name: InterfacesAdded
      description: >
          Emitted when a new object is added or an existing object gains one or
          more interfaces.
      properties:
          - name: ObjectPath
            type: object_path
            description: >
                The object path of the object gaining interfaces.
          - name: InterfacesAndProperties
            type: dict[string,dict[string,variant[all]]]
            description: >
                Maps the added interface names to their property names and
                values. Interfaces without properties have an empty property
                dictionary.

    - name: InterfacesRemoved
      description: >
          Emitted when an object is removed or loses one or more interfaces.
      properties:
          - name: ObjectPath
            type: object_path
            description: >
                The object path of the object losing interfaces.
          - name: Interfaces
            type: array[string]
            description: >
                The names of the interfaces that were removed.
