description: >
    Implement to provide sub-device power state management.

properties:
    - name: RequestedDeviceTransition
      type: enum[self.Transition]
      default: "None"
      description: >
          The desired device transition. Writing a value will initiate the
          corresponding power operation on the device.
      errors:
          - xyz.openbmc_project.State.Device.Error.BMCNotReady
          - xyz.openbmc_project.Common.Error.NotAllowed
          - xyz.openbmc_project.Common.Error.Unavailable

    - name: AllowedDeviceTransitions
      type: set[enum[self.Transition]]
      flags:
          - const
      description: >
          A const property describing the allowed device transitions. Different
          device types and platforms may support different subsets of
          transitions. If this property is empty then all transitions are
          supported.

    - name: CurrentDeviceState
      type: enum[self.DeviceState]
      default: "Unknown"
      description: >
          A read-only property describing the current device power state. A
          device that is in transition reports TransitioningToOff or
          TransitioningToOn.
      flags:
          - readonly

enumerations:
    - name: Transition
      description: >
          The desired transition for a device
      values:
          - name: "On"
            description: >
                The device should be powered on.
          - name: "Off"
            description: >
                The device should be powered off.
          - name: "Reboot"
            description: >
                The device should be rebooted.
          - name: "HardReboot"
            description: >
                The device should be non-gracefully rebooted.
          - name: "PowerCycle"
            description: >
                The device should be powercycled (power off then on).
          - name: "None"
            description: >
                No transition is in progress.

    - name: DeviceState
      description: >
          The current power state of the device
      values:
          - name: "Off"
            description: >
                The device power is off.
          - name: "TransitioningToOff"
            description: >
                The device is transitioning to an Off state.
          - name: "On"
            description: >
                The device power is on.
          - name: "TransitioningToOn"
            description: >
                The device is transitioning to an On state.
          - name: "Unknown"
            description: >
                The device power state has not been determined, for example
                before the implementation has read the device for the first
                time.

paths:
    - namespace: /xyz/openbmc_project/state
      segments:
          - name: Device
            value: device
