version: 1.0.0

description: >
    Events indicating that a Common Platform Error Record (CPER) has been
    reported by a platform component.  CPER diagnostic content should be added
    as an extension.

errors:
    - name: Fatal
      severity: critical
      errno: EIO

      metadata:
          - name: Source
            type: object_path
            primary: true
            description: >
                The inventory object associated with the CPER source.

      redfish-mapping: Platform.PlatformErrorAtLocation

    - name: Recoverable
      severity: error
      errno: EIO

      metadata:
          - name: Source
            type: object_path
            primary: true
            description: >
                The inventory object associated with the CPER source.

      redfish-mapping: Platform.PlatformErrorAtLocation

    - name: Corrected
      severity: warning
      errno: EIO

      metadata:
          - name: Source
            type: object_path
            primary: true
            description: >
                The inventory object associated with the CPER source.

      redfish-mapping: Platform.PlatformErrorAtLocation

    - name: Informational
      severity: informational
      errno: EIO

      metadata:
          - name: Source
            type: object_path
            primary: true
            description: >
                The inventory object associated with the CPER source.

      redfish-mapping: Platform.PlatformErrorAtLocation
