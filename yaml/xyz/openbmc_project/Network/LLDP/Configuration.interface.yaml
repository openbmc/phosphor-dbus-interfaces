description: >
    Configuration of the Link Layer Discovery Protocol (LLDP) agent that a
    network device implements, as defined by IEEE 802.1AB-2016. Transmit and
    receive correspond to the adminStatus of the agent (section 9.2.5.1), which
    enables the two directions independently because a device may advertise its
    own identity without consuming the frames a peer sends to it, or the
    reverse.

    The standard keeps this setting for each LLDP agent (section 9.2.5), and an
    agent serves a port (section 3.1), so an implementation whose hardware
    allows it hosts this interface on an object for each port. One whose
    hardware offers no per-port control applies the configuration to every port
    of the device, and hosts the interface on a single object for the device
    instead. Either way the object links to what it configures, the port or the
    network adapter, through the 'controlling' association.

properties:
    - name: ReceiveMode
      type: enum[self.Mode]
      default: Disabled
      description: >
          Which TLVs the device retains from the LLDP frames a peer sends to it.
          The standard selects TLVs for transmission only (section 10.2.2), so
          limiting what is retained is a capability of the device rather than a
          setting the standard defines. While this is anything other than
          Disabled the device consumes those frames, so they no longer reach the
          host network stack and a host that runs its own LLDP agent stops
          discovering neighbors. An implementation rejects a value that would
          leave a protocol layered on top of LLDP, such as DCBX, without the
          TLVs that protocol requires.
      errors:
          - xyz.openbmc_project.Common.Error.Unavailable
    - name: TransmitMode
      type: enum[self.Mode]
      default: Disabled
      description: >
          Which TLVs the device includes in the LLDP frames it transmits, the
          selection section 10.2.2 describes. This governs only the frames the
          device itself originates and does not stop a host from transmitting
          frames of its own. An implementation rejects a value that would leave
          a protocol layered on top of LLDP, such as DCBX, without the TLVs that
          protocol requires.
      errors:
          - xyz.openbmc_project.Common.Error.Unavailable

enumerations:
    - name: Mode
      description: >
          The set of TLVs an LLDP agent processes in one direction.
      values:
          - name: Disabled
            description: >
                The agent is inactive in this direction. It originates no frames
                when transmitting and retains nothing when receiving.
          - name: Mandatory
            description: >
                Only the TLVs that IEEE 802.1AB requires every LLDPDU to carry
                (section 8.2) are processed: the chassis identifier, the port
                identifier and the time to live.
          - name: All
            description: >
                Every TLV is processed, including the optional ones (section
                8.5) and the organizationally specific ones (section 8.6).

associations:
    - name: controlling
      description: >
          The port whose LLDP agent this object configures, or the network
          adapter when the agent is configured for the whole device.
      reverse_name: controlled_by
      required_endpoint_interfaces:
          - xyz.openbmc_project.Inventory.Connector.Port
          - xyz.openbmc_project.Inventory.Item.NetworkAdapter
