description: >
    Implement on each configuration object entity manager publishes, such as an
    entry in the Exposes array of a configuration, alongside the interface
    specific to the object's type. It gives services one interface to associate
    with these objects, whatever their type. Entries that share a name are
    published on one object, so the interface carries no properties of its own,
    and the name and type of each entry stay on the interface specific to it.

associations:
    - name: configures
      description: >
          The inventory items created from this configuration object by the
          services that consume it, the reverse of their configured_by
          association.
      reverse_name: configured_by
      required_endpoint_interfaces:
          - xyz.openbmc_project.Inventory.Item
