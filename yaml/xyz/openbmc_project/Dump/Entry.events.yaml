version: 1.0.0

events:
    - name: CrashDumpGenerated
      metadata:
          - name: Source
            description: The entity that generated the crash dump.
            type: string
            primary: true
          - name: EntryID
            description: The ID of the entry.
            type: string
            primary: true
      en:
          description: A CPU crash dump has been generated.
          message: "CrashDump generated by '{Source}' at entry '{EntryID}'."
