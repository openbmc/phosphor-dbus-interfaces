description: >
    Implement to indicate the operational status of the object
properties:
    - name: Functional
      type: boolean
      description: >
          The object is functional or not. A "Functional" of false is mapped to
          a Redfish "Status""Health" of "Critical".
      default: false

associations:
    - name: monitoring
      description: >
          When the operational status reports the health of a separate inventory
          item, the object may implement a 'monitoring' association with that
          inventory item.
      reverse_name: monitored_by
      required_endpoint_interfaces:
          - xyz.openbmc_project.Inventory.Item
