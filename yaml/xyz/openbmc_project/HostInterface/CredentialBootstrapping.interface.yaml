description: >
    Implements the credential bootstrapping settings for the Redfish Host
    Interface specification DSP0270.

properties:
    - name: EnableAfterReset
      type: boolean
      default: true
      description: >
          Indicates whether credential bootstrapping is enabled after a reset
          for this interface. When true, credential bootstrapping is enabled
          after a reset of the host or service.

    - name: CredentialBootstrappingEnabled
      type: boolean
      default: false
      description: >
          Indicates whether credential bootstrapping is currently enabled for
          this interface.

    - name: CredentialBootstrappingRole
      type: enum[self.Role]
      default: Administrator
      description: >
          The RoleId associated with the bootstrap account created for the
          Redfish Host Interface.

enumerations:
    - name: Role
      description: >
          CredentialBootstrapping RoleId type enumeration. Defines the role
          assigned to the bootstrap account.
      values:
          - name: Administrator
            description: >
                The assigned Redfish Privileges "Login", "ConfigureManager",
                "ConfigureUsers", "ConfigureSelf", "ConfigureComponents".
          - name: Operator
            description: >
                The assigned Redfish Privileges "Login", "ConfigureSelf",
                "ConfigureComponents".
          - name: ReadOnly
            description: >
                The assigned Redfish Privileges "Login", "ConfigureSelf".
