description: >
    Implement to provide entity manager configuration for an MCTP endpoint
    reached over I2C.

properties:
    - name: Type
      type: string
      description: >
          The type of configuration object.
      flags:
          - readonly
    - name: Name
      type: string
      description: >
          The name of the device.
      flags:
          - readonly
    - name: Bus
      type: uint64
      description: >
          The index of the I2C bus the device is attached to.
      flags:
          - readonly
    - name: Address
      type: uint64
      description: >
          The 7-bit address of the device on the I2C bus.
      flags:
          - readonly
