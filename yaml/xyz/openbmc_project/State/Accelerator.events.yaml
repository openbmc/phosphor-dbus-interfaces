version: 1.0.0

description: >
    Events indicating that an accelerator has entered a failed state or has
    recovered from a previously reported failure.

    A Source object may be provided to associate the resulting log entry with an
    accelerator inventory object.

errors:
    - name: AcceleratorFailed
      severity: error
      errno: EIO

      metadata:
          - name: Source
            type: object_path
            primary: true
            description: >
                The inventory object associated with the accelerator.

          - name: FailureType
            type: string
            description: >
                An [optional] identifier of the failure type.

      redfish-mapping: ResourceEvent.ResourceErrorsDetected

events:
    - name: AcceleratorRestored

      metadata:
          - name: Source
            type: object_path
            primary: true
            description: >
                The inventory object associated with the accelerator.

      redfish-mapping: ResourceEvent.ResourceRecovered
