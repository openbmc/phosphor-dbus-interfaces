description: >
    Implement to indicate what chassis area or device the object implementing
    this interface applies to. This can be implemented on any object requiring
    physical context association, such as a sensor reading (e.g., an object
    implementing Sensor.Value) or an inventory item (e.g., an object
    implementing Inventory.Item). Examples of context values are "GPU","Back of
    the Chassis", "Board", etc.

properties:
    - name: Type
      type: enum[self.PhysicalContextType]
      flags:
          - readonly
      description: >
          A device type or an area of the Chassis.

enumerations:
    - name: PhysicalContextType
      description: >
          Values representing a device type or an area of the Chassis.
      values:
          - name: Accelerator
            description: >
                An accelerator.
          - name: Manager
            description: >
                A management controller, such as a BMC.

paths:
    - name: Sensors
      value: /xyz/openbmc_project/sensors
    - name: Inventory
      value: /xyz/openbmc_project/inventory
