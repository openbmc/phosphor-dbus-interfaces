version: 1.0.0

events:
    - name: PlatformCrashDump
      metadata:
          - name: Source
            description: The entity that generated the crash dump.
            type: string
            primary: true
          - name: EntryID
            description: The ID of the entry.
            type: string
            primary: true
      en:
          description:
              A platform or component crash occurred and a diagnostic dump was
              generated.
          message:
              "PlatformCrashDump generated by '{Source}' at entry '{EntryID}'."
