description: >
    Implement to indicate the link status of the object
properties:
    - name: LinkStatus
      type: enum[self.Status]
      default: Disconnected
      description: >
          The current link status of the object.

enumerations:
    - name: Status
      description: >
          Link status enum.
      values:
          - name: Connected
            description: >
                A link is established on the object.
          - name: Disconnected
            description: >
                No link is established on the object.
