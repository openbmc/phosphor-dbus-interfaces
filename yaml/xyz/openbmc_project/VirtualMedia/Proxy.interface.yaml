description: >
    "Proxy" media is used for streaming images through an NBD server proxy. This
    interface defines properties specific to a proxy media configuration.

properties:
    - name: ProxySocket
      type: string
      description: >
          The virtual media service will connect to the proxy through this
          socket. The caller should listen on this socket before attempting to
          insert the virtual media.
      flags:
          - readonly
