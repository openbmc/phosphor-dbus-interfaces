description: >
    Implement this to add Hostboot dump management.

    Hostboot dump collects memory and hardware states in the case of a failure
    during hostboot booting phase.

properties:
    - name: ErrorLogId
      type: uint32
      deprecated: true
      description: >
          Deprecated. Use org.open_power.Logging.PEL.PELID.PELID instead. The
          identifier of the log entry associated with the action which triggered
          the dump. This is a 32-bit unsigned integer that links the dump to a
          specific error log.
